* { box-sizing: border-box; }
.pl-app { display: flex; min-height: 100vh; background: ${h.bg}; color: ${h.ink};
  font-family: "IBM Plex Sans", -apple-system, system-ui, sans-serif; font-size: 14px; line-height: 1.5; }
.pl-num { font-variant-numeric: tabular-nums; }

/* sidebar */
.pl-side { width: 236px; flex: none; background: ${h.panel}; border-right: 1px solid ${h.line};
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.pl-brand { display: flex; align-items: center; gap: 10px; padding: 18px 18px 14px; }
.pl-brandmark { width: 32px; height: 32px; border-radius: 9px; background: ${h.brand};
  display: grid; place-items: center; color: #fff; flex: none; }
.pl-brandname { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 15px; letter-spacing: -.01em; line-height: 1.1; }
.pl-brandsub { font-size: 11px; color: ${h.ink3}; }
.pl-nav { padding: 8px; display: flex; flex-direction: column; gap: 2px; }
.pl-navitem { display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 9px;
  color: ${h.ink2}; cursor: pointer; border: none; background: none; width: 100%; text-align: left;
  font-size: 13.5px; font-family: inherit; transition: background .12s; }
.pl-navitem:hover { background: ${h.slateBg}; }
.pl-navitem.active { background: ${h.brandBg}; color: ${h.brandDk}; font-weight: 600; }
.pl-navitem .pl-badge { margin-left: auto; }
.pl-badge { font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px;
  background: ${h.slateBg}; color: ${h.ink2}; font-variant-numeric: tabular-nums; }
.pl-badge.warn { background: ${h.amberBg}; color: ${h.amber}; }
.pl-side-foot { margin-top: auto; padding: 14px 16px; border-top: 1px solid ${h.line};
  font-size: 11.5px; color: ${h.ink3}; }

/* main */
.pl-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pl-top { display: flex; align-items: center; gap: 14px; padding: 16px 26px; border-bottom: 1px solid ${h.line};
  background: rgba(255,255,255,.75); backdrop-filter: blur(6px); position: sticky; top: 0; z-index: 5; }
.pl-topttl { font-family: "Space Grotesk", sans-serif; font-weight: 600; font-size: 18px; letter-spacing: -.01em; }
.pl-topsub { font-size: 12.5px; color: ${h.ink3}; margin-top: 1px; }
.pl-top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.pl-content { padding: 22px 26px 60px; max-width: 1180px; width: 100%; }

/* cards + tiles */
.pl-card { background: ${h.panel}; border: 1px solid ${h.line}; border-radius: 14px; padding: 16px; }
.pl-card-head { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; color: ${h.ink}; margin-bottom: 12px; }
.pl-card-head .sub { margin-left: auto; font-weight: 400; font-size: 12px; color: ${h.ink3}; }
.pl-tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
.pl-tile { background: ${h.panel}; border: 1px solid ${h.line}; border-radius: 13px; padding: 14px; position: relative; }
.pl-tile-num { font-family: "Space Grotesk", sans-serif; font-size: 27px; font-weight: 600; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.pl-tile-lbl { font-size: 12px; color: ${h.ink3}; margin-top: 2px; }
.pl-tile-ico { position: absolute; top: 13px; right: 13px; opacity: .9; }

/* pills + chips */
.pl-pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
.pl-chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 7px; font-size: 11.5px; font-weight: 500; padding: 2px 8px; white-space: nowrap; }

/* risk meter */
.pl-meter { position: relative; height: 6px; border-radius: 999px; flex: 1; min-width: 60px;
  background: linear-gradient(90deg, ${h.brand} 0%, ${h.amber} 55%, ${h.rose} 100%); opacity: .92; }
.pl-meter-thumb { position: absolute; top: 50%; transform: translateY(-50%); width: 12px; height: 12px;
  border-radius: 50%; background: #fff; border: 2px solid ${h.ink}; box-shadow: 0 1px 2px rgba(16,24,40,.3); }

/* gauge */
.pl-gauge-wrap { position: relative; }
.pl-gauge-c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }

/* table */
.pl-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.pl-table th { text-align: left; font-weight: 500; color: ${h.ink3}; font-size: 11.5px; padding: 8px 10px; border-bottom: 1px solid ${h.line}; }
.pl-table td { padding: 11px 10px; border-bottom: 1px solid ${h.line2}; vertical-align: middle; }
.pl-table tr:last-child td { border-bottom: none; }
.pl-rowlink { cursor: pointer; transition: background .1s; }
.pl-rowlink:hover { background: ${h.slateBg}; }

/* segmented tabs */
.pl-seg { display: inline-flex; background: ${h.slateBg}; border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.pl-seg-btn { border: none; background: none; padding: 6px 13px; border-radius: 8px; font-size: 13px; color: ${h.ink2};
  cursor: pointer; font-family: inherit; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.pl-seg-btn.active { background: ${h.panel}; color: ${h.ink}; box-shadow: 0 1px 2px rgba(16,24,40,.08); font-weight: 600; }

/* inputs */
.pl-field { display: flex; flex-direction: column; gap: 5px; }
.pl-label { font-size: 12.5px; color: ${h.ink2}; font-weight: 500; }
.pl-hint { font-size: 11.5px; color: ${h.ink3}; }
.pl-input, .pl-select { border: 1px solid ${h.line}; border-radius: 9px; padding: 9px 11px; font-size: 13.5px;
  font-family: inherit; color: ${h.ink}; background: ${h.panel}; width: 100%; outline: none; transition: border .12s, box-shadow .12s; }
.pl-input:focus, .pl-select:focus { border-color: ${h.brand}; box-shadow: 0 0 0 3px ${h.brandBg}; }
.pl-input::placeholder { color: #98A2B3; }

/* buttons */
.pl-btn { display: inline-flex; align-items: center; gap: 7px; border-radius: 9px; font-family: inherit;
  font-weight: 600; cursor: pointer; border: 1px solid transparent; transition: filter .12s, background .12s; white-space: nowrap; }
.pl-btn:disabled { cursor: default; }
.pl-btn.primary { background: ${h.brand}; color: #fff; }
.pl-btn.primary:hover:not(:disabled) { filter: brightness(1.06); }
.pl-btn.ghost { background: ${h.panel}; color: ${h.ink2}; border-color: ${h.line}; }
.pl-btn.ghost:hover:not(:disabled) { background: ${h.slateBg}; }
.pl-btn.subtle { background: ${h.slateBg}; color: ${h.ink2}; }
.pl-btn.subtle:hover:not(:disabled) { filter: brightness(.97); }
.pl-btn.danger { background: ${h.roseBg}; color: ${h.rose}; }
.pl-btn.danger:hover:not(:disabled) { filter: brightness(.98); }

.pl-check-ico { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.pl-check-body { flex: 1; min-width: 0; }
.pl-check-t { font-size: 13.5px; font-weight: 500; color: ${h.ink}; }
.pl-check-e { font-size: 12.5px; color: ${h.ink3}; margin-top: 1px; }
@keyframes plspin { to { transform: rotate(360deg); } }
.pl-spin { animation: plspin .8s linear infinite; }

/* screening card */
.pl-scard { border: 1px solid ${h.line}; border-radius: 12px; padding: 14px; }

.pl-kv-k { display: inline-flex; align-items: center; gap: 7px; color: ${h.ink3}; font-size: 12.5px; }
.pl-kv-v { font-size: 13px; font-weight: 500; }

/* timeline */
.pl-tl { position: relative; padding-left: 8px; }
.pl-tl-item { display: flex; gap: 12px; padding-bottom: 16px; position: relative; }

.pl-tl-rail { position: relative; display: flex; flex-direction: column; align-items: center; }
.pl-tl-dot { width: 11px; height: 11px; border-radius: 50%; border: 2px solid #fff; flex: none; margin-top: 3px; z-index: 1; }
.pl-tl-line { width: 2px; flex: 1; background: ${h.line}; margin-top: 2px; }

/* toggle */

/* chat */
.pl-chat { display: flex; flex-direction: column; height: calc(100vh - 190px); min-height: 440px; }

.pl-msg { display: flex; gap: 10px; max-width: 82%; }

.pl-avatar { width: 30px; height: 30px; border-radius: 9px; flex: none; display: grid; place-items: center; }
.pl-composer { display: flex; gap: 8px; align-items: flex-end; border-top: 1px solid ${h.line}; padding-top: 12px; }
.pl-suggest { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
.pl-suggest button { border: 1px solid ${h.line}; background: ${h.panel}; border-radius: 999px; padding: 6px 12px;
  font-size: 12.5px; color: ${h.ink2}; cursor: pointer; font-family: inherit; }
.pl-suggest button:hover { background: ${h.slateBg}; }

.pl-arch { display: flex; flex-direction: column; align-items: stretch; gap: 0; }
.pl-layer { border: 1px solid ${h.line}; border-radius: 14px; padding: 16px; background: ${h.panel}; }

.pl-node-sub { font-size: 12px; color: ${h.ink3}; margin-top: 4px; }
.pl-edge { display: flex; flex-direction: column; align-items: center; padding: 8px 0; color: ${h.ink3}; }
.pl-edge-lbl { font-size: 12px; color: ${h.ink3}; margin-bottom: 4px; display: inline-flex; align-items: center; gap: 6px; }
.pl-sdot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

.pl-note { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: ${h.ink2};

.pl-empty { text-align: center; color: ${h.ink3}; font-size: 13px; padding: 34px 10px; }
.pl-divider { height: 1px; background: ${h.line2}; margin: 14px 0; }

::-webkit-scrollbar-thumb { background: #D3D8E0; border-radius: 999px; border: 3px solid ${h.bg}; }

@media (max-width: 900px) {
  .pl-side { position: fixed; z-index: 40; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 8px 40px rgba(16,24,40,.18); }
  .pl-side.open { transform: translateX(0); }
  .pl-tiles { grid-template-columns: repeat(2, 1fr); }
  .pl-nodes { grid-template-columns: 1fr; }
  .pl-content { padding: 16px 14px 60px; }
  .pl-top { padding: 13px 14px; }
}
